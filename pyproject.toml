[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workplace-learning-recommender"
version = "0.1.0"
description = "Explainable workplace learning recommendations with eligibility filters, context fit, coverage control, and ranking sensitivity."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Devis Wawan Saputra"}]
readme = "README.md"
keywords = [
  "workplace-learning",
  "learning-and-development",
  "learning-recommender",
  "resource-recommendation",
  "skills-development",
  "explainable-recommendation",
  "workforce-development",
  "python",
]

[project.urls]
Repository = "https://github.com/devissaputra/workplace_learning_recommender"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
