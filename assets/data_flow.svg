<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="455" viewBox="0 0 1200 455" role="img" aria-labelledby="title desc">
<title id="title">Workplace Learning Recommender data and reasoning flow</title>
<desc id="desc">Confirmed development needs and explicit workplace context are joined with a resource catalog, filtered for feasibility, scored across ten visible dimensions and reranked for skill coverage.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52656D"/></marker></defs>
<rect width="100%" height="100%" fill="#FAFBFA"/>
<text x="60" y="64" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1B2430">Workplace Learning Recommender · data and reasoning flow</text>
<text x="60" y="98" font-family="Arial, sans-serif" font-size="17" fill="#5B6660">The baseline uses declared needs and context; it does not infer hidden employee preferences or capability.</text>

<rect x="55" y="140" width="230" height="120" rx="18" fill="#E8F1F3" stroke="#87949A" stroke-width="2"/>
<text x="170" y="176" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Inputs</text>
<text x="170" y="202" text-anchor="middle" font-family="Arial" font-size="15" fill="#26343B">confirmed needs</text>
<text x="170" y="223" text-anchor="middle" font-family="Arial" font-size="15" fill="#26343B">task / role / goals</text>
<text x="170" y="244" text-anchor="middle" font-family="Arial" font-size="15" fill="#26343B">resource catalog</text>

<line x1="290" y1="200" x2="345" y2="200" stroke="#52656D" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="360" y="140" width="230" height="120" rx="18" fill="#EEF3E8" stroke="#87949A" stroke-width="2"/>
<text x="475" y="176" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Hard eligibility</text>
<text x="475" y="202" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">level · prerequisites · time</text>
<text x="475" y="223" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">language · availability</text>
<text x="475" y="244" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">completed / no confirmed need</text>

<line x1="595" y1="200" x2="650" y2="200" stroke="#52656D" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="665" y="140" width="230" height="120" rx="18" fill="#F5EDE4" stroke="#87949A" stroke-width="2"/>
<text x="780" y="176" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Transparent score</text>
<text x="780" y="202" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">need · coverage · task · role · goal</text>
<text x="780" y="223" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">quality · modality · effort</text>
<text x="780" y="244" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">freshness · novelty</text>

<line x1="900" y1="200" x2="945" y2="200" stroke="#52656D" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="960" y="140" width="190" height="120" rx="18" fill="#ECE8F5" stroke="#87949A" stroke-width="2"/>
<text x="1055" y="176" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Output</text>
<text x="1055" y="202" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">skill coverage</text>
<text x="1055" y="223" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">ranked resources</text>
<text x="1055" y="244" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">reasons + exclusions</text>

<text x="60" y="325" font-family="Arial" font-size="15" fill="#5B6660">Coverage reranking gives distinct confirmed gaps a chance to appear before additional items from the same skill are added.</text>
<text x="60" y="352" font-family="Arial" font-size="15" fill="#5B6660">Weight sensitivity can then show whether the recommendation order depends strongly on one chosen scoring configuration.</text>
<text x="60" y="390" font-family="Arial" font-size="14" fill="#7A8580">No empirical relevance or learning-effectiveness claim is encoded in this diagram.</text>
</svg>